name: Bug report
description: Reporte um comportamento incorreto ou inesperado.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o WhaNext.

  - type: input
    id: version
    attributes:
      label: Versão do WhaNext
      placeholder: 0.3.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Versão do Node.js
      placeholder: 22.14.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o esperado.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução mínima
      description: Inclua somente o código necessário e remova sessões, números e segredos.
      render: ts
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs sanitizados
      description: Use logger em debug e remova qualquer dado sensível restante.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Não incluí sessão, pairing code, telefone ou credenciais.
          required: true
        - label: Testei com uma versão suportada do Node.js.
          required: true
